html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SilverOrg Bank - Secure Private Banking</title>
    <style>
        :root {
            --primary-white: #ffffff;
            --secondary-red: #8B0000;
            --bg-light-grey: #f4f4f4;
            --text-dark: #333333;
            --text-grey: #666666;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-light-grey);
            color: var(--text-dark);
            line-height: 1.6;
        }
        header {
            background-color: var(--primary-white);
            border-bottom: 4px solid var(--secondary-red);
            padding: 15px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        .logo {
            font-size: 28px;
            font-weight: bold;
            color: var(--secondary-red);
        }
        nav {
            display: flex;
            align-items: center;
        }
        nav a {
            margin-left: 20px;
            text-decoration: none;
            color: var(--text-dark);
            font-weight: 600;
        }
        .btn-client {
            background-color: var(--secondary-red);
            color: var(--primary-white);
            padding: 8px 16px;
            border-radius: 4px;
        }
        .btn-admin {
            background-color: var(--text-dark);
            color: var(--primary-white);
            padding: 8px 16px;
            border-radius: 4px;
        }
        .hero {
            position: relative;
            height: 85vh;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            padding: 0 10%;
            overflow: hidden;
        }
        .hero-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            object-fit: cover;
        }
        .hero-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, rgba(255,255,255,0.95) 40%, rgba(255,255,255,0.4) 100%);
            z-index: 2;
        }
        .hero-content {
            position: relative;
            z-index: 3;
            max-width: 600px;
        }
        .hero h1 {
            font-size: 56px;
            color: var(--secondary-red);
            line-height: 1.1;
            margin-bottom: 20px;
        }
        .hero p {
            font-size: 20px;
            color: var(--text-dark);
            margin-bottom: 30px;
            font-weight: 500;
        }
        .btn-get-started {
            display: inline-block;
            background-color: var(--secondary-red);
            color: var(--primary-white);
            padding: 15px 35px;
            text-decoration: none;
            font-size: 18px;
            font-weight: bold;
            border-radius: 5px;
        }
        .registration-section {
            padding: 80px 10%;
            background-color: var(--primary-white);
        }
        .form-container {
            max-width: 600px;
            margin: 0 auto;
            background-color: var(--bg-light-grey);
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 16px;
        }
        .btn-submit {
            width: 100%;
            background-color: var(--secondary-red);
            color: var(--primary-white);
            padding: 15px;
            border: none;
            border-radius: 4px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }
        .login-modals {
            display: none; 
            padding: 40px 10%;
            background-color: #eee;
            text-align: center;
        }
    </style>
</head>
<body>

<header>
    <div class="logo">SilverOrg Bank</div>
    <nav>
        <a href="#register" style="color: var(--secondary-red);">Open Account</a>
        <a href="#" class="btn-client">Client Login</a>
        <a href="#" class="btn-admin">Admin Login</a>
    </nav>
</header>

<section class="hero">
    <img src="https://images.unsplash.com/photo-1573496359142-b8d87734a5a2?auto=format&fit=crop&w=1920&q=80" alt="Banking Professional" class="hero-bg">
    <div class="hero-overlay"></div>
    <div class="hero-content">
        <h1>Excellence in Private Banking.</h1>
        <p>Tailored wealth management and secure digital banking designed for your distinct financial journey.</p>
        <a href="#register" class="btn-get-started">Get Started</a>
    </div>
</section>

<section class="registration-section" id="register">
    <div  <div class="form-container">
        <h2 style="text-align: center; margin-bottom: 30px; color: var(--secondary-red);">Client Registration</h2>
        <form onsubmit="event.preventDefault(); alert('Registration simulated successfully.');">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" required placeholder="John Doe">
            </div>
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" required placeholder="john@example.com">
            </div>
            <div class="form-group">
                <label>Phone Number</label>
                <input type="tel" required placeholder="+1 234 567 8900">
            </div>
            <div class="form-group">
                <label>Physical Address</label>
                <input type="text" required placeholder="123 Financial District">
            </div>
            <div class="form-group">
                <label>Account Type</label>
                <select>
                    <option>Personal Savings</option>
                    <option>Private Wealth Checking</option>
                    <option>Corporate Treasury</option>
                </select>
            </div>
            <button type="submit" class="btn-submit">Complete Registration</button>
        </form>
    </div>
</section>

</body>
</html>
