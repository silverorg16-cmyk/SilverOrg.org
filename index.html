    :root {
      --primary: #0f172a;
      --accent: #2563eb;

      --bg: #f8fafc;

      --text-main: #0f172a;

      --border: #e2e8f0;
      --success: #10b981;
      --radius: 12px;
      --shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Header */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 1rem 5%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo {
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--primary);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .logo span {
      color: var(--accent);
    }

    .nav-btn {
      background: var(--accent);
      color: white;
      border: none;
      padding: 0.6rem 1.2rem;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .nav-btn:hover {
      background: var(--accent-hover);

    /* Views */
    .view {
      display: none;
      flex: 1;
    }

    .view.active {
      display: flex;
      flex-direction: column;
    }

    .hero {

      min-height: 90vh;

      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: var(--primary);
      color: white;
      text-align: center;
      padding: 4rem 1rem;
    }

    .hero-bg-media {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.4;
      z-index: 1;
    }

    .hero-content {
      position: relative;
      z-index: 2;
      max-width: 800px;
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(10px);
      padding: 3rem;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .hero h1 {
      font-size: 3.5rem;
      margin-bottom: 1.5rem;
      font-weight: 800;
    }

    .hero p {
      font-size: 1.25rem;
      color: #94a3b8;
      margin-bottom: 2.5rem;
      line-height: 1.6;
    }

    .hero .cta-btn {
      font-size: 1.2rem;
      padding: 1rem 2.5rem;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 50px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.2s, background 0.2s;
      box-shadow: 0 4px 20px rgba(37, 99, 235, 0.5);
    }

    .hero .cta-btn:hover {
      transform: scale(1.05);
      background: var(--accent-hover);
    }

    /* Features Section */
    .features {
      padding: 5rem 5%;
      background: var(--surface);
      max-width: 1200px;
      margin: 0 auto;
    }

    .section-title {
      text-align: center;
      font-size: 2.5rem;
      margin-bottom: 3rem;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 2rem;
    }

    .card {
      padding: 2rem;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      text-align: center;
    }

    .card h3 {
      margin-bottom: 1rem;
      font-size: 1.5rem;
    }

      padding: 2rem;
    }
